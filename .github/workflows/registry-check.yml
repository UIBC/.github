name: registry-check

on:
  push:
    paths:
      - "registry/**"
      - ".github/workflows/registry-check.yml"
  pull_request:
    paths:
      - "registry/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registry index
        run: python registry/check_registry.py
      - name: Negative control (bad entries must be rejected)
        run: python registry/negative_control.py
