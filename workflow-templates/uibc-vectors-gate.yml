# Deployable starter workflow: run the UIBC vectors gate in your own repository.
#
# This is the org-level template GitHub offers under "Actions → New workflow"
# once the `.github` repository carries it. Copying it into your repository
# gives you the six-row gate as a check, pinned to a suite version, without
# vendoring our tooling.
#
# It answers exactly one question: "does the reference verifier still produce
# the six documented verdicts on the committed fixtures?" It does not audit
# your code, and it cannot certify anything.

name: UIBC vectors gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin both. A gate that floats answers a different question tomorrow.
  UIBC_CORE_VERSION: "0.5.0"
  UIBC_VECTORS_REF: "main"

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        py: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Fetch the fixtures at a pinned ref
        uses: actions/checkout@v4
        with:
          repository: UIBC/vectors
          ref: ${{ env.UIBC_VECTORS_REF }}
          path: .uibc-vectors
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Install the pinned verifier from PyPI
        run: python -m pip install --disable-pip-version-check "uibc-core==${{ env.UIBC_CORE_VERSION }}"

      - name: Six-row expectation gate
        working-directory: .uibc-vectors
        run: python tools/run_vectors.py

      - name: Key hygiene (no seed outside keys/, fixtures pinned by digest)
        working-directory: .uibc-vectors
        run: python tools/check_key_hygiene.py
